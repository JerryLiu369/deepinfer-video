      accept_rate *= confidence_data[i][j]; ... mtp.accept_rates.push_back(accept_rate);
    commit: 9bd9cf2
    kb: [R09#10]
    conditions: 每步每请求在 CPU 上执行 O(nextn) 标量循环
    verified_by: fact-checker@2026-10-26

