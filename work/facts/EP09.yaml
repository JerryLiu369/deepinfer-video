# EP09 事实账本（经 fact-checker 严格复核）
episode: EP09
facts:
  - id: F09-01
    claim: DeepInfer 投机解码中草稿模块类名为 DFlash，挂在 MTP_module 槽位；每请求草稿数/块长来自环境变量 DEEPINFER_USE_NEXTN_DECODE，默认值为 5，设为 0 可关闭投机解码。
    screen: 草稿类 DFlash · 默认猜 5 个
    grade: A
    status: verified
    evidence:
      - "deepinfer/model_executor/models/deepseek.py:302"
      - "deepinfer/model_executor/models/mtp/dflash.py:99-104"
      - "deepinfer/environ.py:129-130"
    quote: >-
      self.MTP_module = DFlash(model, cfg, self.model.embed_tokens, self.lm_head) ;
      self.max_MTP_value = envs.DEEPINFER_USE_NEXTN_DECODE
    commit: 9bd9cf2
    kb: [R09#1, R09#2]
    conditions: 默认环境配置 DEEPINFER_USE_NEXTN_DECODE=5
    verified_by: fact-checker@2026-10-26

  - id: F09-02
    claim: DFlash 的草稿生成不是 5 次自回归串行前向，而是用 [golden, noise×4] 构造成块，只做 1 次块并行前向（3 个草稿层遍历），串行前向次数与块长无关。
    screen: 1 次块并行前向 · 非 5 次自回归
    grade: A
    status: verified
    evidence:
      - "deepinfer/model_executor/models/mtp/dflash.py:230-256"
    quote: >-
      draft_init_tokens = torch.full((req_cnt, self.dflash_block_size), fill_value=self.noise_token_id, ...) ;
      draft_init_tokens[:, 0] = golden_tokens
    commit: 9bd9cf2
    kb: [R09#4]
    conditions: V4.1-Flash 的 num_nextn_predict_layers 为 3 层
    verified_by: fact-checker@2026-10-26

  - id: F09-03
    claim: DFlash 块内注意力是非因果的，5 个草稿位置共用同一份 kv_index 展开，覆盖最近 window_size 个已接受 token 与本块全部 5 个草稿槽位，草稿位置之间彼此可见。
    screen: 块内双向可见 · 共享 kv_index
    grade: A
    status: verified
    evidence:
      - "deepinfer/model_executor/layers/tilelang_ops/get_kv_index.py:183-197"
      - "deepinfer/model_executor/models/v4_modules/attn.py:976-1008"
    quote: >-
      kv_index = kv_index_per_req.unsqueeze(1).expand(-1, dflash_block_size, -1).reshape(-1, padded_kv_len)
    commit: 9bd9cf2
    kb: [R09#3]
    conditions: 写入草稿 K 发生在读取之前
    verified_by: fact-checker@2026-10-26

  - id: F09-04
    claim: DFlash 依靠主干 forward 顺手收集的目标层特征注入，投影并写入 nextn SWA cache，不需要从头自回归重建上下文，也不用重复跑主干。
    screen: 目标特征注入 · 复用主干上下文
    grade: A
    status: verified
    evidence:
      - "deepinfer/model_executor/models/mtp/dflash.py:198-228"
      - "deepinfer/model_executor/models/deepseek.py:220-223"
    quote: >-
      dflash.update_main_cache(dflash_input, dflash_metadata, kv_caches)
    commit: 9bd9cf2
    kb: [R09#6]
    conditions: 目标层 ID 由 dspark_target_layer_ids 配置
    verified_by: fact-checker@2026-10-26

  - id: F09-05
    claim: DFlash 采样包含 5 步轻量串行循环，每步通过低秩 Markov 头（markov_w1 与 markov_w2）将前一个已采出的草稿 token 偏置加到下一个位置的 logits 上，补齐自回归依赖。
    screen: 半自回归 · 5步Markov修正
    grade: A
    status: verified
    evidence:
      - "deepinfer/model_executor/models/mtp/dflash.py:290-339"
      - "deepinfer/model_executor/models/v4_modules/heads.py:26-34"
    quote: >-
      if self.enable_markov: w1 = self.markov_w1(draft_token_ids); logits = self.markov_w2(w1, out_acc=logits)
    commit: 9bd9cf2
    kb: [R09#5]
    conditions: 低秩 markov_rank 由模型配置给定，只做轻量向量查表与投影
    verified_by: fact-checker@2026-10-26

  - id: F09-06
    claim: 草稿 KV 只活一个 decode 步，写入 SWA 环形缓冲槽位，被拒绝的草稿 KV 靠下一轮前向直接覆盖，不需要显式删除或内存截断。
    screen: 零成本回退 · 下轮前向原地覆盖
    grade: A
    status: verified
    evidence:
      - "deepinfer/model_executor/models/mtp/dflash.py:206-208"
      - "deepinfer/model_executor/models/v4_modules/attn.py:975-990"
    quote: >-
      # Draft keys live for one decode step and are overwritten by the next step.
    commit: 9bd9cf2
    kb: [R09#7]
    conditions: 槽位由 (draft_positions % swa_block_size + state_offset) 计算
    verified_by: fact-checker@2026-10-26

  - id: F09-07
    claim: 验证采样采用概率拒绝采样，判据为 U < exp(min(0, log q - log p))；残差分布重采样引入 DRAFT_PROB_PENALTY=5e-5 防止退化空分布，输出与目标分布仅有极小扰动。
    screen: 概率拒绝采样 · 惩罚项 5e-5
    grade: A
    status: verified
    evidence:
      - "deepinfer/model_executor/layers/tilelang_ops/fused_sample.py:232-246"
      - "deepinfer/model_executor/layers/tilelang_ops/common.py:52-53"
    quote: >-
      residual = (sample_probs - (draft_logprobs - DRAFT_PROB_PENALTY).exp()).relu_() ;
      accept_lp = torch.clamp(target_lp - draft_token_lp, max=0)
    commit: 9bd9cf2
    kb: [R09#15, R09#16]
    conditions: U 由 (seq_seed, sample_position) 伪随机哈希生成
    verified_by: fact-checker@2026-10-26

  - id: F09-08
    claim: ConfidenceHead 仅存在于最后一个草稿层，结构为线性层拼接隐藏态与 Markov embedding 并除以温度后过 sigmoid，为每个草稿位置输出一个 (0,1) 之间的接受概率标量。
    screen: 置信度头 · 尾层带温 sigmoid
    grade: A
    status: verified
    evidence:
      - "deepinfer/model_executor/models/mtp/dflash.py:46-78"
      - "deepinfer/model_executor/models/v4_modules/heads.py:102-105"
      - "deepinfer/model_executor/layers/tilelang_ops/dflash.py:17"
    quote: >-
      Fused sigmoid(cat([hidden, markov_emb], -1) @ weight / temperature)
    commit: 9bd9cf2
    kb: [R09#8]
    conditions: 仅第 MTP_num_layers-1 层挂载 AcceptRatePredictor
    verified_by: fact-checker@2026-10-26

  - id: F09-09
    claim: 环境变量 DEEPINFER_DFLASH_CONFIDENCE_HEAD_TEMPERATURE 支持逗号分隔的 5 个温度浮点数，用于按位置进行校准以最小化累积乘积误差。
    screen: 逐位置温度 · STS 序列校准
    grade: A
