      - "deepinfer/environ.py:134-143"
    quote: >-
      if "," in raw: parts = [float(x.strip()) for x in raw.split(",")]; ... if len(parts) != nextn: raise ValueError(...)
    commit: 9bd9cf2
    kb: [R09#9]
    conditions: 默认值为 1.0；校准值来自外部离线流程
    verified_by: fact-checker@2026-10-26

  - id: F09-10
    claim: C++ 调度器在 process_MTPInfo 中对每个请求的独立草稿置信度执行前缀累乘得到生存概率 a_j = Π_{k≤j} c_k，单调不增地存入 mtp.accept_rates。
    screen: 前缀累乘 · 严格单调生存概率
    grade: A
    status: verified
    evidence:
      - "csrc/engine/scheduler.hpp:1244-1252"
