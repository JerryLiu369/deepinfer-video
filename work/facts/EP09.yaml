    commit: 9bd9cf2
    kb: [R09#21]
    conditions: 滑动窗口大小 5000，每个桶至少 10 个样本才计入
    verified_by: fact-checker@2026-10-26

  - id: F09-13
    claim: CPU 调度器按累乘接受率降序排列全局候选，逐个累加计算 cur_expected / time_ms，以预期接受 token 数除以估计步耗时为目标函数全表扫描选出最佳总批量 best_bsz。
    screen: 目标函数 · 预期接受数 ÷ 步耗时
    grade: A
    status: verified
    evidence:
      - "csrc/engine/mtp_varlen.hpp:228-258"
    quote: >-
      const double time_ms = baseline_ms + slope_ms * graph_size + sampler_ms;
      const double cur_throughput = cur_expected / time_ms;
      if (cur_throughput > best_throughput) { best_throughput = cur_throughput; best_bsz = cur_bsz; }
    commit: 9bd9cf2
    kb: [R09#12]
    conditions: baseline_ms 来自第一个大于等于 cur_bsz 的 CUDA graph 桶
    verified_by: fact-checker@2026-10-26

