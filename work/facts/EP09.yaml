  - id: F09-17
    claim: 官方实测在 EP64/DP64 配置下，约 60 并发生产工作点动态变长验证使平均验证长度由 5 降至 3.58，接受长度保持 3.21（固定为 3.30），估计吞吐提升 +5.4%（48~72 并发落在 +4~7% 区间）；并发 16 时反而 -1.5%。
    screen: 60并发+5%·16并发-1.5%
    grade: B
    status: verified
    evidence:
      - "doc/inference_deployment_qa.md:245-256"
    quote: >-
      Computed from EP64/DP64 benchmark data, that works out to +4–7% throughput at the production operating point (~60 concurrent sequences per rank).
    conditions: 硬件为 EP64/DP64 评测环境，数字为 estimated throughput (tok/s/rank)
    verified_by: fact-checker@2026-10-26

  - id: F09-18
    claim: 16 并发亏损与 60 并发增益的反差源于曲线形状与桶跨度：16 并发裁剪 9 个 token 仅跨最多 1 个桶，因固定基线延迟主导无法抵消 2.4% 接受损失；60 并发跨 11 个桶，算力主导下节省时间显著超过接受损失。
    screen: 根因：桶跨度差异与延迟地板
    grade: E
    status: verified_with_caveat
    evidence:
      - "doc/inference_deployment_qa.md:249-256"
      - "deepinfer/environ.py:155"
      - "csrc/engine/mtp_varlen.hpp:235-245"
    calc: calc/EP09_curves.py
    conditions: 基于 8 等距桶与官方基准数据的理论与几何推导
    caveat: 官方仅给出吞吐估计值，具体各桶毫秒基线与权重比例属于理论推断
    verified_by: fact-checker@2026-10-26

