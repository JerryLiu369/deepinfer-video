    screen: GPU就地捡词·CPU不填存量
    grade: A
    status: verified
    evidence:
      - "csrc/engine/zos.cpp:84-113"
      - "deepinfer/model_executor/layers/tilelang_ops/cuda/gather_input_ids_zos.py:32-47"
    quote: >-
