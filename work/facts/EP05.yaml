# EP05 事实账本：调度：让 GPU 一刻不停
# 代码基线：deepseek-ai/DeepInfer @ 9bd9cf243fc53ef9afbf8f04d391d989117d6ab9 (2026-10-21)
episode: EP05
facts:
  - id: F05-01
    claim: >-
      ZOS（Zero-Overhead Scheduling）的核心机制是让 GPU 执行第 N 步模型计算的同时，CPU 并发处理第 N-1 步的输出并调度准备第 N+1 步，从而消除 CPU 调度开销对 GPU 造成的等待空泡。
    screen: ZOS：GPU算当前·CPU整前后
    grade: A
    status: verified
    evidence:
      - "deepinfer/worker/worker.py:96-103"
      - "deepinfer/worker/worker.py:182-187"
    quote: >-
      1. Forward current step (main model); 2. Post-process previous step; 3. Sample current step; 4. Post-process current step: in place for prompt / non-ZOS steps; ZOS decode steps defer it to the next step to overlap with forward
    commit: 9bd9cf2
    kb: [R05#11, R05#12]
    conditions: 官方核心执行入口 execute_model_step 规范；NORMAL 与 COMPLETION 引擎默认开启
    verified_by: fact-checker@2026-10-26

  - id: F05-02
    claim: >-
      在传统的同步调度时间线中，GPU 跑完第 N 步的 forward 与 sample 之后，CPU 必须阻塞等待 GPU 完成，并在 CPU 执行后处理与下一步调度期间让 GPU 完全空闲，产生 15%–30% 的 GPU 空泡。
    screen: 同步调度：CPU干活·GPU空转
    grade: A
    status: verified
    evidence:
      - "deepinfer/worker/worker.py:262-263"
      - "csrc/engine/scheduler.hpp:881-887"
    quote: >-
      with cpu_timer.record("worker.post_process.sync"): step_state.sample_end_evt.synchronize()
    commit: 9bd9cf2
    calc: calc/EP05_bubble.py
    kb: [R05#13, R05#Q2]
    conditions: non-ZOS 模式下每个 step 均当场同步等待；典型前向耗时 4.6 ms 时 CPU 额外耗时 1.5 ms（空泡占比 24.6%）
    verified_by: fact-checker@2026-10-26

  - id: F05-03
    claim: >-
      worker.py 中的 execute_model_step 固定分为四段：当前步前向（Forward）、上一步后处理（Post-process prev）、当前步采样（Sample）、当前步后处理（Post-process curr）。
    screen: 四段式骨架：前向-上步-采样-后处理
    grade: A
    status: verified
    evidence:
      - "deepinfer/worker/worker.py:98-102"
      - "deepinfer/worker/worker.py:122-187"
    quote: >-
      1. Forward current step (main model); 2. Post-process previous step; 3. Sample current step; 4. Post-process current step
    commit: 9bd9cf2
    kb: [R05#11]
    conditions: 全局所有步类型（prompt/decode、ZOS开/关、陪跑步）统一走该四段式入口
    verified_by: fact-checker@2026-10-26

  - id: F05-04
    claim: >-
      ZOS 异步重叠仅在连续的 decode 步之间生效；prefill（prompt）步仍为纯同步执行并在当场完成两次后处理，会强制排空异步流水线，且 prefill 之后的第一步 decode 没有可重叠对象。
    screen: ZOS仅限连续解码·Prefill纯同步
    grade: A
    status: verified
    evidence:
      - "deepinfer/worker/worker.py:182-187"
      - "deepinfer/worker/worker.py:198-200"
    quote: >-
      if is_prompt or not envs.DEEPINFER_ZERO_OVERHEAD_SCHEDULING: request_outputs = np.concatenate([request_outputs, self._post_process_step(curr_step_state)]); self.prev_step_state = None
    commit: 9bd9cf2
    kb: [R05#1, R05#12]
    conditions: 源码硬编码逻辑；is_prompt=True 时立即执行 synchronize 并清空 prev_step_state
    verified_by: fact-checker@2026-10-26

  - id: F05-05
    claim: >-
      ZOS 下 CPU 的等待点后移到上上轮的采样事件（sample_end_evt），由于该事件在 GPU 流上排在当前步 forward 之前，CPU 真正调用 synchronize 时 GPU 早已完成，CPU 实现近乎零等待。
    screen: 等待点后移：上轮事件早已就绪
    grade: A
    status: verified
    evidence:
      - "deepinfer/worker/worker.py:167-168"
      - "deepinfer/worker/worker.py:262-263"
    quote: >-
      with cpu_timer.record("worker.post_process.sync"): step_state.sample_end_evt.synchronize()
    commit: 9bd9cf2
    kb: [R05#13]
    conditions: 流水线顺序：sample(N-1) 入队早于 forward(N)，CPU 在 forward(N) 入队后才同步 sample(N-1)
    verified_by: fact-checker@2026-10-26

