    commit: 9bd9cf2
    kb: [R05#2, R05#15, R05#16]
    conditions: remap >= 0 的存量请求 CPU 写入 0 字节，全部由 GPU 算子原地索引读取
    verified_by: fact-checker@2026-10-26

