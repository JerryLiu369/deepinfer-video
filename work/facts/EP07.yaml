# EP07 事实账本（经 fact-checker 严格复核）
episode: EP07
facts:
  - id: F07-01
    claim: V4.1-Flash 主干 40 层，每层都有滑动窗口注意力，窗口 128；DeepInfer 从 HF 配置的 sliding_window 读入窗口大小。
    screen: 40 层 · 每层窗口 128
    grade: A
    status: verified
    evidence:
      - "deepinfer/hugging_face/config.py:284"
      - "HF config.json: num_hidden_layers=40, sliding_window=128"
    quote: 'window_size=(text["sliding_window"], 0),'
    commit: 9bd9cf2
    kb: [R02a#1, R02a#3]
    conditions: 只指主干 40 层，不含 MTP 草稿层
    verified_by: fact-checker@2026-10-25
  - id: F07-02
    claim: 部署问答称，精确重建 decoder 层的 SWA KV 需要把最后 2,560 个 token 跑过 20 个 decoder 层。
    screen: 2,560 token × 20 层
    grade: B
    status: verified
    evidence: ["doc/inference_deployment_qa.md:187"]
    quote: 'reconstructing it exactly would require running the last 2,560 tokens through 20 decoder layers'
    conditions: DeepSeek 官方文档的说法；2,560 恰为 20 × 128，但文档没有写出推导
    verified_by: fact-checker@2026-10-25
  - id: F07-03
    claim: 有界重放只重算最近 128 个 token，并把注意力截断在重放段内：从 s 开始重放时，位置 i 只看 max(s, i−127) 到 i；得到近似的 SWA KV，重算代价变为常数，与上下文长度和层数无关。
    screen: max(s, i−127) … i
    grade: B
    status: verified
    evidence: ["doc/inference_deployment_qa.md:183"]
    quote: 'replaying from position s, the query at position i is computed only against keys in the range max(s, i−127) to i, which yields an approximate SWA KV cache.'
    conditions: 官方文档描述；代码实现见 R07 #6–#10（csrc/engine/input_metadata/prepare_tensor_input_v4.cpp），完整一集需另立 A 级条目
    verified_by: fact-checker@2026-10-25
  - id: F07-04
    claim: 有界重放用于两处：encoder 侧命中缓存但缺 SWA KV 时，重算命中前缀最后 128 个 token；decoder 侧每次 prefill 只重算提示词最后 128 个 token，结果只给 decode 用、不进前缀缓存；文档称这几乎让 prefill 总计算量减半。
    screen: 两处：命中补算/解码预填
    grade: B
    status: verified_with_caveat
    evidence: ["doc/inference_deployment_qa.md:185", "doc/inference_deployment_qa.md:187"]
    quote: 'nearly halving total prefill computation'
    conditions: 官方文档描述 DeepSeek 生产系统；"减半"指计算量，不是延迟
    caveat: 文档说 decoder 重算"最后 128 个"，代码保留行数要求 ≥ 134、README 设 140（见 F07-05）；命中长度的决定逻辑不在开源仓库
    verified_by: fact-checker@2026-10-25
  - id: F07-05
    claim: decoder 截断由两个环境变量控制：TRUNCATION_MODE（off/mask/compact，默认 off）与 KEEP_TOKENS（默认 0）；开启时代码断言 window_size + MAX_BACKTRACKING_TOKENS ≤ KEEP_TOKENS；README 给 V4.1 的设置是 compact + 140。
    screen: 保留 ≥ 134 · 推荐 140
    grade: A
    status: verified_with_caveat
    evidence:
      - "deepinfer/environ.py:188-194"
      - "deepinfer/worker/model_runner.py:107-113"
      - "README.md:25"
    quote: 'assert self.window_size + envs.DEEPINFER_MAX_BACKTRACKING_TOKENS <= envs.DEEPINFER_YOCO_PREFILL_KEEP_TOKENS'
    commit: 9bd9cf2
    kb: [R07#1, R07#2]
    conditions: 代码默认关闭；README 推荐值
    caveat: 140 比下限 134 多 6，代码与文档都没有解释多出的部分；不要写成"140 = 128 + 2×6"之类的算式
    verified_by: fact-checker@2026-10-25
  - id: F07-06
    claim: MAX_BACKTRACKING_TOKENS 取 max(设定值, USE_NEXTN_DECODE + 1)；USE_NEXTN_DECODE 默认 5，所以回退预算默认是 6。
    screen: 回退预算 6 = 5 + 1
    grade: A
    status: verified
    evidence: ["deepinfer/environ.py:129-132"]
    quote: 'DEEPINFER_MAX_BACKTRACKING_TOKENS = EnvVar(lambda v: max(_int(v), envs.DEEPINFER_USE_NEXTN_DECODE + 1))'
    commit: 9bd9cf2
    kb: [R07#2]
    conditions: 默认配置
    verified_by: fact-checker@2026-10-25
  - id: F07-07
    claim: compact 模式下，C++ 侧只保留每个序列末尾 keep_tokens 范围内的 query 行；整块都在保留区之前的 chunk 仍保留最后 1 行占位。
    screen: 只留末尾 KEEP 行
    grade: A
    status: verified
    evidence: ["csrc/engine/input_metadata/prepare_tensor_input_v4.cpp:222-229"]
    quote: 'int32_t clip_prefix = compact ? std::clamp(data_len - keep_tokens - q_start, 0, q_len - 1) : 0;'
    commit: 9bd9cf2
    kb: [R07#1, R07#7]
    conditions: 仅 compact 模式；mask 模式不删行
    verified_by: fact-checker@2026-10-25
  - id: F07-08
    claim: 第一个 decoder（YOCO consumer）层在删行之前，仍对全长输入做 attn_norm，并用全长 hidden 更新 main/index KV。
    screen: 第 20 层仍处理全长
    grade: A
    status: verified
    evidence:
      - "deepinfer/model_executor/models/decoder_layer.py:137-141"
      - "deepinfer/model_executor/models/v4_modules/attn.py:672-685"
    quote: 'cross_layer_runtime.consumer_full_hidden = self.attn_norm_forward(*full_inputs)[1]'
    commit: 9bd9cf2
    kb: [R07#13]
    conditions: V4.1 的第一个 consumer 层是第 20 层（n_prefill_layer = 20，R02b）
    verified_by: fact-checker@2026-10-25
  - id: F07-09
    claim: examples/yoco/yoco_equiv.py 比较的是同一截断设置下 mask 与 compact 两种模式；keep_tokens=0 时两种模式都不走 yoco 路径，只验证结果 bitwise 相同。仓库里没有"截断 vs 不截断"的数值对比脚本。
    screen: 测试比的是两种截断写法
    grade: A
    status: verified_with_caveat
    evidence:
      - "examples/yoco/yoco_equiv.py:534-536"
      - "examples/yoco/yoco_equiv.py:796-797"
    quote: 'mode = "off" if cfg.keep_tokens == 0 else ("compact" if cfg.compact else "mask")'
    commit: 9bd9cf2
    kb: [R07#19, R07#20, R07#21]
    conditions: 全仓库递归检索 tests/ 与 examples/ 确认无截断开启 vs 关闭的精度对比脚本
    caveat: 测试仅验证 harness 确定性与两种截断实现的一致性，不能作为精度无损的证据
    verified_by: fact-checker@2026-10-25
  - id: F07-10
    claim: 示意账：输入 10,000 token，不截断时 40 层共 400,000 行·层；截断后前 20 层 200,000 + 后 20 层 20×140=2,800，合计 202,800，约为原来的 50.7%。
    screen: 20.28万/40万 ≈ 50.7%
    grade: E
    status: verified_with_caveat
    evidence: ["calc/EP07_rows.py"]
    calc: calc/EP07_rows.py
    conditions: 示意：输入长度为假设值；"行·层"只数 query 行，不等于 FLOPs
    caveat: 忽略了第 20 层的全长处理（F07-08）与各层每行开销差异；只能说明"约一半"的来源
    verified_by: fact-checker@2026-10-25
  - id: F07-11
    claim: 技术报告称有界重放重建的 decoder SWA KV 与完整前向在数学上不等价，但对回答质量影响可以忽略；并在后训练中模拟同样的重放做适配。
    screen: 官方：影响可忽略（定性）
    grade: B
    status: verified_with_caveat
    evidence: ["https://arxiv.org/abs/2609.19969 §3.2.2"]
    quote: 'By design, the reconstructed decoder SWA KV is not mathematically equivalent ... we additionally simulate the same replay during post-training'
    kb: [R07#22]
    conditions: 官方定性说法，已复核 arXiv 2609.19969 §3.2.2 原文，未给具体定量 PPL/分数值
    caveat: 精度保障部分来自后训练模拟适配（train-aware adaptation），不可随意推论至未适配模型
    verified_by: fact-checker@2026-10-25
  - id: F07-12
    claim: mask 与 compact 两种模式共享同一套可见域（滑窗 ∩ 矩形）；mask 保留全部 query 行仅将矩形外可见域置空（不省计算），compact 真正切除 query 行以减少 consumer 层计算。
    screen: mask不删行 · compact删行
    grade: A
    status: verified
    evidence:
      - "deepinfer/model_executor/models/deepseek.py:193-208"
      - "csrc/engine/input_metadata/prepare_tensor_input_v4.cpp:222-229"
    quote: 'consumer_metadata = input_metadata.get_consumer_view()'
    commit: 9bd9cf2
    kb: [R07#11, R07#12]
    conditions: 截断模式由 DEEPINFER_YOCO_PREFILL_TRUNCATION_MODE 控制
    verified_by: fact-checker@2026-10-25
  - id: F07-13
    claim: compact 模式下，整块都在保留区之前的 chunk 仍保留最后 1 行 token 占位，避免空 chunk 导致内核索引异常。
    screen: 全截断chunk保留1行占位
    grade: A
    status: verified
    evidence:
      - "csrc/engine/input_metadata/prepare_tensor_input_v4.cpp:224-226"
      - "tests/engine/test_flops_estimator.py:54-58"
    quote: 'int32_t clip_prefix = compact ? std::clamp(data_len - keep_tokens - q_start, 0, q_len - 1) : 0;'
