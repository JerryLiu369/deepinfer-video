      显存状态复制机制与半成品痕迹：LLMEngine 内部定义了显存副本缓冲区 copy_state 与 GPU 拷贝逻辑（copy_state[state_id].copy_ 并记录 last_copy_state_token_idx），与文档中每跨 128 边界向显存副本区拷贝一次当前窗口以备存储的机制完全吻合，但开源版中 copy_state 初始化为 None 且判定方法恒为 False。
