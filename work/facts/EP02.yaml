  - id: F02-04
    claim: >-
      生产系统的整体物理拓扑：DeepSeek 生产环境采用 E/P/D（Entrypoint / Prefill / Decode）三段分离架构与专用 3FS 集中式存储集群；Prefill 节点采用算力受限的标准 8 卡机（EP2–8/DP2–8），Decode 节点采用宽专家并行超节点（EP64–128/DP64–128），最小高效服务单元为 64P + 64D（共 128 张 GPU）。
    screen: E/P/D三段分离超节点
